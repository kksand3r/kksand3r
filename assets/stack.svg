  <text x="28" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#484f58">_<animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="2.7s" repeatCount="indefinite"/></text>
